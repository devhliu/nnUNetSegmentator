[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "nnunetsegmentator"
version = "0.2.0"
description = "A unified framework for medical image segmentation with multiple nnUNet models"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "devhliu"}
]
maintainers = [
    {name = "devhliu"}
]
keywords = [
    "medical-imaging",
    "segmentation",
    "deep-learning",
    "nnunetv2",
    "nnunet",
    "oncology",
    "pet-ct",
    "pet",
    "ct",
    "mri",
    "dicom",
    "nifti",
    "totalsegmentator",
    "gtrc-net",
    "lion",
    "deep-psma",
    "dukeseg",
    "mrsegmentator",
    "medical-image-analysis",
    "computer-vision",
    "artificial-intelligence",
    "machine-learning",
    "healthcare",
    "radiology",
    "clinical-imaging"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed"
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pydicom>=2.3.0",
    "nibabel>=3.2.0",
    "PyYAML>=5.4.0",
    "requests>=2.25.0",
    "tqdm>=4.60.0",
    "imageio>=2.9.0",
    "dicom2nifti>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=3.0",
    "black>=21.0",
    "flake8>=3.9",
    "isort>=5.0",
    "mypy>=0.900",
    "pre-commit>=2.15.0",
]
visualization = [
    "matplotlib>=3.4.0",
]
nnunet = [
    "nnunetv2>=2.0",
    "TotalSegmentator>=2.0.0",
]
metrics = [
    "pandas>=1.3.0",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=0.15",
]
all = [
    "nnunetsegmentator[dev,visualization,nnunet,metrics,docs]",
]

[project.urls]
Homepage = "https://github.com/devhliu/nnunetsegmentator"
Documentation = "https://github.com/devhliu/nnunetsegmentator#readme"
Repository = "https://github.com/devhliu/nnunetsegmentator.git"
"Bug Tracker" = "https://github.com/devhliu/nnunetsegmentator/issues"
Changelog = "https://github.com/devhliu/nnunetsegmentator/blob/main/CHANGELOG.md"

[project.scripts]
nnunetsegmentator = "nnunetsegmentator.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nnunetsegmentator = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
pretty = true
show_error_codes = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = [
    "nibabel.*",
    "pydicom.*",
    "scipy.*",
    "nnunetv2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=nnunetsegmentator --cov-report=term-missing"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/nnunetsegmentator"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
